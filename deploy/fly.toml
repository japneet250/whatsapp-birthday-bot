# Fly.io config. From the repo root:
#   fly launch --config deploy/fly.toml --copy-config --no-deploy
#   fly volumes create bot_data --size 1
#   fly secrets set DASHBOARD_PASSWORD=your-password
#   fly deploy --config deploy/fly.toml
app = "my-birthday-bot"
primary_region = "yyz"

[build]
  dockerfile = "../Dockerfile"

[env]
  TIMEZONE = "America/Toronto"
  SEND_TIME = "00:00"

[[mounts]]
  source = "bot_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # The bot must stay awake to send at midnight.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
